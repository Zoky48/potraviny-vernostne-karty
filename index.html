<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vernostné karty</title>
  <style>
    :root{
      --bg:#eef0f3;
      --panel:#f4f5f7;
      --card:#f5f5f5;
      --main:#1f2a37;
      --muted:#6b7280;
      --shadow: 0 12px 18px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
      --border: rgba(17,24,39,0.08);
      --accent: #3b82f6;
      --accent-2: #0ea5e9;
      --toggle-bg: #fff;
      --toggle-border: rgba(17,24,39,0.06);
      --navy:#1f729d;
      --label:#1e293b;
      --soft:#dfe4ea;
    }

    body.dark{
      --bg:#0f172a;
      --panel:#111827;
      --card:#1f2937;
      --main:#e5eefc;
      --muted:#b5c0d0;
      --shadow: 0 12px 20px rgba(0,0,0,0.35), 0 2px 6px rgba(0,0,0,0.22);
      --border: rgba(148,163,184,0.18);
      --accent: #60a5fa;
      --accent-2: #38bdf8;
      --toggle-bg: #0b1220;
      --toggle-border: rgba(148,163,184,0.2);
      --navy:#7ec8ff;
      --label:#ebf2ff;
      --soft:#1e293b;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--main);
      transition: background 0.3s ease, color 0.3s ease;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 28px 16px 48px;
    }

    .app {
      width: min(100%, 1040px);
    }

    @keyframes slideInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    @keyframes shimmer {
      0% {
        background-position: -1000px 0;
      }
      100% {
        background-position: 1000px 0;
      }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes flip {
      from {
        transform: rotateY(0deg);
        opacity: 1;
      }
      to {
        transform: rotateY(360deg);
        opacity: 1;
      }
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 16px;
      height: 70px;
      animation: slideInDown 0.6s ease-out;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      font-weight: 800;
      font-size: clamp(2rem, 2.2vw, 3rem);
      line-height: 1;
      letter-spacing: -0.05em;
      color: var(--main);
    }

    .brand .icon {
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--main);
      opacity: 0.9;
      animation: slideInDown 0.8s ease-out 0.1s both;
    }

    .brand span:last-child {
      animation: slideInDown 0.8s ease-out 0.2s both;
    }

    .theme-toggle {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      box-shadow: var(--shadow);
      border-radius: 999px;
      padding: 8px 12px;
      color: var(--main);
      cursor: pointer;
      font-weight: 700;
      user-select: none;
      transition: all 0.3s ease;
      animation: slideInDown 0.6s ease-out;
    }

    .theme-toggle:hover {
      transform: translateY(-50%) scale(1.05);
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.2);
    }

    .theme-toggle:active {
      transform: translateY(-50%) scale(0.98);
    }

    .theme-toggle .dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.3);
      animation: spin 0.4s ease-in-out;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 22px;
      margin-top: 8px;
    }

    .section {
      margin-top: 8px;
      animation: fadeIn 0.6s ease-out;
    }

    .section:nth-child(1) { animation-delay: 0.1s; }
    .section:nth-child(2) { animation-delay: 0.2s; }
    .section:nth-child(3) { animation-delay: 0.3s; }
    .section:nth-child(4) { animation-delay: 0.4s; }
    .section:nth-child(5) { animation-delay: 0.5s; }
    .section:nth-child(6) { animation-delay: 0.6s; }

    .section-header {
      margin: 0 0 12px 0;
      padding-left: 8px;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--main);
      letter-spacing: -0.04em;
      animation: slideInUp 0.5s ease-out;
    }

    .card {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 112px;
      padding: 18px 28px 18px 22px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      animation: slideInUp 0.5s ease-out both;
    }

    .card:nth-child(1) { animation-delay: 0.05s; }
    .card:nth-child(2) { animation-delay: 0.1s; }
    .card:nth-child(3) { animation-delay: 0.15s; }
    .card:nth-child(4) { animation-delay: 0.2s; }
    .card:nth-child(5) { animation-delay: 0.25s; }
    .card:nth-child(6) { animation-delay: 0.3s; }
    .card:nth-child(7) { animation-delay: 0.35s; }
    .card:nth-child(8) { animation-delay: 0.4s; }
    .card:nth-child(9) { animation-delay: 0.45s; }
    .card:nth-child(10) { animation-delay: 0.5s; }
    .card:nth-child(11) { animation-delay: 0.55s; }
    .card:nth-child(12) { animation-delay: 0.6s; }
    .card:nth-child(13) { animation-delay: 0.65s; }

    .card:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 20px 30px rgba(0,0,0,0.12), 0 4px 12px rgba(0,0,0,0.06);
      border-color: rgba(59,130,246,0.3);
    }

    .card:active {
      transform: translateY(-2px) scale(0.99);
    }

    .card::before {
      content: "";
      position: absolute;
      right: 0;
      top: 0;
      width: 10px;
      height: 100%;
      background: var(--accent, #3b82f6);
      border-radius: 0 20px 20px 0;
      opacity: 0.92;
      transform-origin: bottom;
      animation: slideInRight 0.4s ease-out 0.2s both;
    }

    @keyframes slideInRight {
      from {
        transform: scaleY(0);
        opacity: 0;
      }
      to {
        transform: scaleY(1);
        opacity: 0.92;
      }
    }

    .card .brand-box {
      display: flex;
      align-items: center;
      gap: 18px;
      position: relative;
      z-index: 1;
      flex: 1;
    }

    .shop-logo {
      width: 80px;
      height: 46px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      letter-spacing: -0.06em;
      color: #fff;
      font-size: 1.1rem;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15), 0 4px 12px rgba(0,0,0,0.1);
      text-transform: uppercase;
      animation: scaleIn 0.5s ease-out 0.3s both;
      overflow: hidden;
      position: relative;
      background: linear-gradient(135deg, #dfeaf7, #e9effa);
    }

    .shop-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #fff;
      border-radius: 12px;
    }

    .shop-logo span {
      font-size: 0.78rem;
      transform: scale(0.9);
      display: inline-block;
    }

    .shop-name {
      font-weight: 800;
      font-size: clamp(1.7rem, 2vw, 3rem);
      letter-spacing: -0.06em;
      position: relative;
      z-index: 1;
      color: var(--main);
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideInUp 0.5s ease-out 0.25s both;
    }

    .card .badge {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      width: 12px;
      height: 48px;
      border-radius: 10px 10px 0 0;
      background: var(--accent);
      opacity: 0.9;
      z-index: 0;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      backdrop-filter: blur(2px);
      animation: fadeIn 0.3s ease-out;
    }

    .modal-panel {
      width: min(90vw, 420px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      padding: 26px 22px 20px;
      position: relative;
      animation: scaleIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-close {
      position: absolute;
      right: 16px;
      top: 14px;
      border: none;
      background: transparent;
      font-size: 1.4rem;
      cursor: pointer;
      color: var(--main);
      line-height: 1;
      transition: all 0.2s ease;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }

    .modal-close:hover {
      background: rgba(59, 130, 246, 0.1);
      transform: rotate(90deg);
    }

    .modal-title {
      margin: 0 0 18px;
      font-size: 1.8rem;
      letter-spacing: -0.05em;
      text-align: center;
      color: var(--main);
      animation: slideInDown 0.4s ease-out 0.1s both;
    }

    .modal-qr {
      display: block;
      margin: 0 auto 12px;
      width: 220px;
      height: 220px;
      border-radius: 14px;
      background: #fff;
      padding: 10px;
      animation: flip 0.6s ease-out 0.2s;
    }

    .modal-caption {
      margin: 0;
      color: var(--muted);
      text-align: center;
      font-size: 0.92rem;
      animation: fadeIn 0.4s ease-out 0.4s both;

    const storeList = document.getElementById("storeList");
    const themeToggle = document.getElementById("themeToggle");
    const themeLabel = document.getElementById("themeLabel");

    function brandClass(name) {
      const n = name.toLowerCase()
        .replace(/[^a-z0-9]/g, "")
        .replace(/\s+/g, "");
      return n;
    }

    function logoMarkup(shop) {
      if (shop.logoUrl) {
        return `<img src="${shop.logoUrl}" alt="${shop.name}" loading="lazy" onerror="this.style.display='none'; this.parentElement.innerHTML='<span>${shop.logo}</span>'" />`;
      }

      return `<span>${shop.logo}</span>`;
    }

    function renderCards() {
      storeList.innerHTML = "";

      data.forEach(section => {
        const sectionWrap = document.createElement("div");
        sectionWrap.className = "section";

        const title = document.createElement("h2");
        title.className = "section-header";
        title.textContent = section.category;
        sectionWrap.appendChild(title);

        section.stores.forEach(shop => {
          const card = document.createElement("div");
          card.className = "card";
          card.setAttribute("data-accent", shop.accent || "blue");
          card.setAttribute("tabindex", "0");
          card.setAttribute("role", "button");
          card.setAttribute("aria-label", `Zobraziť QR kód pre ${shop.name}`);

          const brandBox = document.createElement("div");
          brandBox.className = "brand-box";

          const logo = document.createElement("div");
          logo.className = "shop-logo " + brandClass(shop.name);
          logo.innerHTML = logoMarkup(shop);

          const name = document.createElement("div");
          name.className = "shop-name";
          name.textContent = shop.name;

          brandBox.appendChild(logo);
          brandBox.appendChild(name);

          const badge = document.createElement("div");
          badge.className = "badge";
          card.appendChild(badge);
          card.appendChild(brandBox);

          card.addEventListener("click", () => openQrModal(shop.name));
          card.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              openQrModal(shop.name);
            }
          });

          sectionWrap.appendChild(card);
        });

        storeList.appendChild(sectionWrap);
      });
    }

    function openQrModal(shopName) {
      const modal = document.createElement("div");
      modal.className = "modal-backdrop";

      const panel = document.createElement("div");
      panel.className = "modal-panel";

      const close = document.createElement("button");
      close.className = "modal-close";
      close.textContent = "✕";
      close.setAttribute("aria-label", "Zavrieť");

      const title = document.createElement("h3");
      title.className = "modal-title";
      title.textContent = shopName;

      const qr = document.createElement("img");
      const encoded = encodeURIComponent(`https://example.com/${shopName.replace(/\s+/g, "-").toLowerCase()}`);
      qr.className = "modal-qr";
      qr.src = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encoded}`;
      qr.alt = `QR kód pre ${shopName}`;

      const caption = document.createElement("p");
      caption.className = "modal-caption";
      caption.textContent = "Skenovať kľúčom do aplikácie";

      close.addEventListener("click", () => {
        modal.style.animation = "fadeIn 0.3s ease-out reverse";
        setTimeout(() => modal.remove(), 300);
      });

      modal.addEventListener("click", (event) => {
        if (event.target === modal) {
          modal.style.animation = "fadeIn 0.3s ease-out reverse";
          setTimeout(() => modal.remove(), 300);
        }
      });

      const escapeHandler = (e) => {
        if (e.key === "Escape") {
          close.click();
          document.removeEventListener("keydown", escapeHandler);
        }
      };
      document.addEventListener("keydown", escapeHandler);

      panel.appendChild(close);
      panel.appendChild(title);
      panel.appendChild(qr);
      panel.appendChild(caption);
      modal.appendChild(panel);
      document.body.appendChild(modal);
    }

    function applyTheme(theme) {
      const isDark = theme === "dark";
      document.body.classList.toggle("dark", isDark);
      themeLabel.textContent = isDark ? "Svetlý mód" : "Tmavý mód";
      localStorage.setItem("theme", theme);
    }

    const savedTheme = localStorage.getItem("theme") || "light";
    applyTheme(savedTheme);

    themeToggle.addEventListener("click", () => {
      const dot = themeToggle.querySelector(".dot");
      dot.style.animation = "spin 0.4s ease-in-out";
      setTimeout(() => {
        dot.style.animation = "none";
      }, 400);

      const next = document.body.classList.contains("dark") ? "light" : "dark";
      applyTheme(next);
    });

    renderCards();

    document.addEventListener("click", (e) => {
      const card = e.target.closest(".card");
      if (card) {
        const ripple = document.createElement("span");
        ripple.style.position = "absolute";
        ripple.style.borderRadius = "50%";
        ripple.style.background = "rgba(59, 130, 246, 0.3)";
        ripple.style.pointerEvents = "none";
        ripple.style.animation = "rippleAnimation 0.6s ease-out";

        const rect = card.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const x = e.clientX - rect.left - size / 2;
        const y = e.clientY - rect.top - size / 2;

        ripple.style.width = ripple.style.height = size + "px";
        ripple.style.left = x + "px";
        ripple.style.top = y + "px";

        if (!document.querySelector("style[data-ripple]")) {
          const style = document.createElement("style");
          style.setAttribute("data-ripple", "true");
          style.textContent = `
            @keyframes rippleAnimation {
              from {
                transform: scale(0);
                opacity: 1;
              }
              to {
                transform: scale(1);
                opacity: 0;
              }
            }
          `;
          document.head.appendChild(style);
        }

        card.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
      }
    });
  </script>
